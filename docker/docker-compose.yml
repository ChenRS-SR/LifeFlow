services:
  # 前端服务
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lifeflow-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - lifeflow-network

  # 后端服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lifeflow-backend
    restart: always
    expose:
      - "8000"
    volumes:
      # 数据持久化：将数据库文件挂载到宿主机
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/lifeflow.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
      - FRONTEND_URL=${FRONTEND_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lifeflow-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: lifeflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lifeflow-network
    # 自动重载配置
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot SSL证书自动续期（可选）
  certbot:
    image: certbot/certbot
    container_name: lifeflow-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - lifeflow-network

networks:
  lifeflow-network:
    driver: bridge
